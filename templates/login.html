<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — Piyu Tasks</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><div class="auth-shell"><a class="brand" href="{{ url_for('index') }}"><span class="brand-dot"></span>Piyu Tasks</a><div class="auth-card"><span class="eyebrow">WELCOME BACK</span><h1>Log in</h1><p>Open your task workspace.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert {{category}}">{{message}}</div>{% endfor %}{% endwith %}<form method="post"><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button class="primary-btn full" type="submit">Log in</button></form><p class="auth-foot">No account? <a href="{{ url_for('register') }}">Create one</a></p></div></div></body></html>
