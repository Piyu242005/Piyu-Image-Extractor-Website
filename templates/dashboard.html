<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — Piyu Tasks</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body>
<div class="shell">
  <header class="navbar"><a class="brand" href="{{ url_for('dashboard') }}"><span class="brand-dot"></span>Piyu Tasks</a><div class="userbar"><span>{{ current_user["name"] }}</span><a class="ghost-btn" href="{{ url_for('logout') }}">Log out</a></div></header>
  <main class="dashboard">
    <section class="dash-head"><div><span class="eyebrow">YOUR WORKSPACE</span><h1>Task dashboard</h1><p>Keep priorities visible and progress moving.</p></div><button class="primary-btn" id="new-task">+ New task</button></section>
    <section class="stats"><div><span>Total</span><strong id="stat-total">0</strong></div><div><span>To do</span><strong id="stat-todo">0</strong></div><div><span>In progress</span><strong id="stat-progress">0</strong></div><div><span>Done</span><strong id="stat-done">0</strong></div></section>
    <section class="toolbar"><input id="search" placeholder="Search tasks…"><select id="status-filter"><option value="all">All status</option><option value="todo">To do</option><option value="in_progress">In progress</option><option value="done">Done</option></select><select id="priority-filter"><option value="all">All priority</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></section>
    <section id="task-list" class="task-list"></section>
    <div id="empty" class="empty hidden"><div class="empty-icon">✓</div><h2>No tasks found</h2><p>Create your first task or adjust the filters.</p></div>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modal-title">New task</h2><button class="icon-btn" id="close-modal">×</button></div><form id="task-form"><input type="hidden" id="task-id"><label>Title<input id="task-title" required maxlength="120"></label><label>Description<textarea id="task-description" rows="4"></textarea></label><div class="form-grid"><label>Status<select id="task-status"><option value="todo">To do</option><option value="in_progress">In progress</option><option value="done">Done</option></select></label><label>Priority<select id="task-priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label></div><label>Due date<input id="task-due" type="date"></label><button class="primary-btn full" type="submit">Save task</button></form></div></div>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body></html>
