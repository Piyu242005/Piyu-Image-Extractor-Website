<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — Piyu Tasks</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><div class="auth-shell"><a class="brand" href="{{ url_for('index') }}"><span class="brand-dot"></span>Piyu Tasks</a><div class="auth-card"><span class="eyebrow">GET STARTED</span><h1>Create account</h1><p>Your personal task workspace starts here.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert {{category}}">{{message}}</div>{% endfor %}{% endwith %}<form method="post"><label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required></label><button class="primary-btn full" type="submit">Create account</button></form><p class="auth-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></div></body></html>
